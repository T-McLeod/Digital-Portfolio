name: Deploy Backend to Cloud Run

on:
  push:
    branches: ["main", "Deploy-to-Google-Cloud"]
    paths:
      - "backend/**"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

  AR_REPOSITORY: portfolio-backend
  BACKEND_IMAGE: portfolio-api
  CLOUD_RUN_SERVICE: portfolio-api

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        working-directory: backend
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.BACKEND_IMAGE }}"
          docker build -t "${IMAGE_TAG}:${{ github.sha }}" -t "${IMAGE_TAG}:latest" .
          docker push "${IMAGE_TAG}:${{ github.sha }}"
          docker push "${IMAGE_TAG}:latest"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          env_vars: |
            DEBUG=False
            ALLOWED_HOSTS=*
            CORS_ALLOWED_ORIGINS=${{ secrets.FRONTEND_URL }}
            CSRF_TRUSTED_ORIGINS=${{ secrets.FRONTEND_URL }}
            SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DB_ENGINE=${{ vars.DB_ENGINE || 'sqlite3' }}
            SECURE_SSL_REDIRECT=False
          flags: |
            --allow-unauthenticated
            --port=8000
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --concurrency=80
