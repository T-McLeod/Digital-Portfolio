version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_network

  web:
    build: .
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DB_ENGINE=postgresql
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio_network

volumes:
  postgres_data:
  media_volume:
  static_volume:

networks:
  portfolio_network:
    driver: bridge
