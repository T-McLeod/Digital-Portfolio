server {
    listen 80;
    server_name tanner-mcleod-portfolio.colab.duke.edu;

    # ACME http-01 challenge webroot (required for certbot webroot method)
    location ^~ /.well-known/acme-challenge/ {
        # Certbot will write files to <WEBROOT>/.well-known/acme-challenge/<token>
        # Using root here keeps the layout predictable.
        root /home/vcm/repositories/Digital-Repository/backend/letsencrypt-challenges;
        default_type "text/plain";
        try_files $uri =404;
        access_log off;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server: terminate TLS and proxy to the Django app running in Docker
server {
    listen 443 ssl http2;
    server_name tanner-mcleod-portfolio.colab.duke.edu;

    ssl_certificate /etc/letsencrypt/live/tanner-mcleod-portfolio.colab.duke.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanner-mcleod-portfolio.colab.duke.edu/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Proxy dynamic requests to the Django app (web container publishes 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tell Django the original request scheme was HTTPS
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Serve static files directly from the repo/static build if present
    location /static/ {
        alias /home/vcm/repositories/Digital-Repository/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Serve uploaded media directly
    location /media/ {
        alias /home/vcm/repositories/Digital-Repository/backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}